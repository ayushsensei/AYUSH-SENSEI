<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binge Roulette – Random Anime Picker</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#120506;--line:#3a0b0e;--red:#ff2441;--deep:#8f0f1c;--text:#f4eaea;--mute:#a88b8d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
h1,h2,.title{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
h1{font-size:clamp(44px,12vw,92px);line-height:.95}
h1 span{color:var(--red)}
.sub{color:var(--mute);margin:10px 0 22px;max-width:46ch}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
select,input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;min-width:0}
.go{background:var(--red);border:0;border-radius:6px;padding:14px 26px;font-family:'Dela Gothic One',Impact,sans-serif;font-size:22px;letter-spacing:.03em;flex:1 1 100%}
.go:hover{background:#ff1a25}
.card{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:8px;padding:22px;min-height:190px}
.card .title{font-size:clamp(32px,8vw,56px);line-height:1.02}
.card.roll .title{color:var(--mute)}
.meta{color:var(--mute);margin:8px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mute)}
.st{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--red);background:transparent;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600}
.chip[data-s=watching][aria-pressed=true]{background:var(--red);color:#fff}
.chip[data-s=watched][aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.chip[data-s=watchlist][aria-pressed=true]{background:#fff;border-color:#fff;color:#000}
.chip[data-s=dropped]{border-color:#555;color:#999}
.chip[data-s=dropped][aria-pressed=true]{background:#222;border-color:#555;color:#bbb;text-decoration:line-through}
h2{font-size:34px;margin:44px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 14px;white-space:nowrap;color:var(--mute)}
.tab[aria-selected=true]{border-color:var(--red);color:#fff;background:var(--panel)}
.tab b{color:var(--red);margin-left:4px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.row .n{font-weight:700}
.row .m{color:var(--mute);font-size:13px}
.row .st{grid-column:1/-1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:2px solid var(--red)}
.dot.watching{background:var(--red)}.dot.watched{background:var(--deep);border-color:var(--deep)}
.dot.watchlist{background:#fff;border-color:#fff}.dot.dropped{background:#333;border-color:#555}
.desc{margin:10px 0 0;max-width:62ch}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-family:'Dela Gothic One',Impact,sans-serif;font-size:22px;letter-spacing:.04em;color:var(--red)}
[hidden]{display:none!important}
.libbtn{margin-top:20px;background:none;border:1px solid var(--red);border-radius:6px;padding:10px 18px;font-weight:600}
.libbtn:hover{background:var(--panel)}
.acct{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:14px;color:var(--mute)}
.acct a,.acct button,.pbt{color:var(--text);border:1px solid var(--red);border-radius:6px;padding:6px 12px;background:none;text-decoration:none;font-size:14px;font-weight:600;margin:0 8px 8px 0}
.acct a,.acct button{margin:0}
.acct a:hover,.acct button:hover,.pbt:hover{background:var(--panel)}
.lt{margin-bottom:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
.panel textarea{width:100%;background:#000;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:14px/1.4 'M PLUS Rounded 1c',system-ui,sans-serif;margin-bottom:10px;resize:vertical}
.panel .m{color:var(--mute);margin:0 0 8px}
.empty{color:var(--mute);padding:18px;border:1px dashed var(--line);border-radius:6px}
@media(min-width:640px){.go{flex:0 0 auto}.row{grid-template-columns:1fr auto}.row .st{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* anime theme */
body{background:radial-gradient(circle at 100% 0,rgba(255,36,65,.28),transparent 40%),radial-gradient(rgba(255,36,65,.16) 1.3px,transparent 1.7px) 0 0/16px 16px,#000;background-attachment:fixed}
.hero{position:relative;padding:8px 44px 18px 0;margin-bottom:18px;border-bottom:3px solid #fff;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 88% 35%,rgba(255,36,65,.35) 0 1deg,transparent 1deg 5deg);-webkit-mask-image:radial-gradient(circle at 88% 35%,transparent 10%,#000 70%);mask-image:radial-gradient(circle at 88% 35%,transparent 10%,#000 70%)}
.hero>*{position:relative}
.hero>.jp{position:absolute;right:4px;top:6px;writing-mode:vertical-rl;font-weight:800;font-size:17px;line-height:1;letter-spacing:.3em;color:#fff;background:var(--red);padding:10px 5px;border:2px solid #fff}
h1{font-size:clamp(38px,11vw,84px);line-height:1.05;text-shadow:4px 4px 0 var(--deep);transform:skewX(-6deg);transform-origin:left}
h1 span{-webkit-text-stroke:2px #fff;paint-order:stroke fill}
.sub{font-weight:700;margin-bottom:0}
.go{border:3px solid #fff;box-shadow:5px 5px 0 #fff;transform:skewX(-8deg);font-size:20px;transition:transform .08s,box-shadow .08s}
.go:hover{transform:skewX(-8deg) translate(2px,2px);box-shadow:3px 3px 0 #fff}
.go:active{transform:skewX(-8deg) translate(5px,5px);box-shadow:0 0 0 #fff}
select,input{border:2px solid #fff;border-radius:4px;font-weight:700}
.card{position:relative;background:#080808;border:3px solid #fff;border-radius:4px;box-shadow:7px 7px 0 var(--red)}
.card .title{font-size:clamp(24px,6.5vw,40px);line-height:1.15;text-shadow:3px 3px 0 var(--deep);transform:skewX(-5deg);transform-origin:left}
.card.roll{animation:shake .12s infinite}
.card.pop{animation:pop .35s ease-out}
@keyframes shake{0%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}100%{transform:translate(1px,2px)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.sfx{position:absolute;top:-14px;right:10px;background:var(--red);color:#fff;border:3px solid #fff;padding:2px 12px;font-family:'Dela Gothic One',Impact,sans-serif;font-size:20px;transform:rotate(6deg)}
.tag{background:var(--red);color:#fff;border:2px solid #fff;border-radius:2px;font-weight:800;transform:skewX(-8deg)}
.chip{border-width:2px;border-radius:3px;font-weight:800;box-shadow:2px 2px 0 var(--red)}
.chip:active{transform:translate(2px,2px);box-shadow:none}
h2{display:inline-block;background:var(--red);border:3px solid #fff;padding:2px 16px;transform:skewX(-8deg);font-size:28px}
.tab,.libbtn,.acct a,.acct button,.pbt{border-width:2px;border-radius:3px;font-weight:800}
.tab[aria-selected=true]{background:var(--red);color:#fff;border-color:#fff}
.tab[aria-selected=true] b{color:#fff}
.row{border:2px solid var(--line);border-left:5px solid var(--red);border-radius:3px}
.dot{border-radius:2px;transform:rotate(45deg)}
footer{font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--red);border-top:3px solid #fff}
footer small{font-size:14px;color:var(--red);text-shadow:none}
@media(prefers-reduced-motion:reduce){.card.roll,.card.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="acct" class="acct"></div>
  <div class="hero"><span class="jp" aria-hidden="true">次は何を見る？</span><h1>Binge<br><span>Roulette</span></h1>
  <p class="sub">Can't decide what to watch? Let fate pick your next anime, then track it as you go.</p></div>

  <div class="controls">
    <select id="genre" aria-label="Genre"></select>
    <select id="pool" aria-label="Pick from">
      <option value="fresh">Not started yet</option>
      <option value="watchlist">My watchlist only</option>
      <option value="all">Everything</option>
    </select>
    <button class="go" id="go">Pick my anime</button>
  </div>

  <div class="card" id="card" aria-live="polite">
    <div class="title" style="color:var(--mute)">Press the button.</div>
    <p class="meta">Your pick appears here.</p>
  </div>

  <button class="libbtn" id="libbtn" aria-expanded="false" aria-controls="lib">Open my library</button>
  <section id="lib" hidden>
  <h2>My library</h2>
  <div class="lt"><button class="pbt" id="shareBtn">Share my library</button><button class="pbt" id="impBtn">Import a library</button></div>
  <div id="panel" class="panel" hidden></div>
  <div class="controls"><input id="q" type="search" placeholder="Search titles or descriptions" aria-label="Search titles" style="flex:1"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="list" id="list"></div>
  </section>
</div>

const save=()=>{try{localStorage.setItem("binge-status",JSON.stringify(st))}catch(e){}push()};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const genres=[...new Set(A.flatMap(a=>a[3]))].sort();
$("genre").innerHTML='<option value="">Any genre</option>'+genres.map(g=>`<option>${g}</option>`).join("");

function chips(t){return `<div class="st" role="group" aria-label="Status for ${esc(t)}">`+S.map(s=>
 `<button class="chip" data-s="${s}" data-t="${esc(t)}" aria-pressed="${st[t]===s}">${L[s]}</button>`).join("")+`</div>`}

function renderCard(a,rolling){
 const c=$("card");c.className="card"+(rolling?" roll":"");
 if(rolling){c.innerHTML=`<div class="title">${esc(a[0])}</div><p class="meta">Rolling…</p>`;return}
 c.innerHTML=`<span class="sfx" aria-hidden="true">ドン!</span><div class="title">${esc(a[0])}</div>
 <p class="meta">${a[1]} · ${a[2]} episodes · about ${Math.round(a[2]*24/60)} hours</p>
 <p class="desc">${esc(a[4]||"")}</p>
 <div class="tags">${a[3].map(g=>`<span class="tag">${g}</span>`).join("")}</div>${chips(a[0])}`;
}

function pick(){
 const g=$("genre").value,p=$("pool").value;
 let pool=A.filter(a=>(!g||a[3].includes(g))&&(p==="all"||(p==="watchlist"?st[a[0]]==="watchlist":!st[a[0]])));
 if(!pool.length){$("card").className="card";$("card").innerHTML=`<div class="title">Nothing to pick</div><p class="meta">No matches. Try another genre or pick from Everything.</p>`;return}
 if(pool.length>1&&cur)pool=pool.filter(a=>a[0]!==cur);
 const final=pool[Math.floor(Math.random()*pool.length)];
 const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const done=()=>{cur=final[0];renderCard(final);$("card").classList.add("pop")};
 if(still){done();return}
 let n=0;const t=setInterval(()=>{renderCard(pool[Math.floor(Math.random()*pool.length)],true);if(++n>14){clearInterval(t);done()}},65);
}

function renderList(){
 const q=$("q").value.trim().toLowerCase();
 const cnt=s=>A.filter(a=>st[a[0]]===s).length;
 $("tabs").innerHTML=[["all","All",A.length],...S.map(s=>[s,L[s],cnt(s)])].map(([k,l,n])=>
  `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}<b>${n}</b></button>`).join("");
 const rows=A.filter(a=>(tab==="all"||st[a[0]]===tab)&&(a[0]+" "+a[4]).toLowerCase().includes(q));
 $("list").innerHTML=rows.length?rows.map(a=>`<div class="row"><div><div class="n">${st[a[0]]?`<span class="dot ${st[a[0]]}"></span>`:""}${esc(a[0])}</div>
  <div class="m">${a[1]} · ${a[2]} eps · ${a[3].join(", ")}</div><div class="m">${esc(a[4])}</div></div>${chips(a[0])}</div>`).join("")
  :`<div class="empty">${tab==="all"?"No titles match your search.":"Nothing here yet. Mark an anime as "+L[tab]+" to see it here."}</div>`;
}

document.addEventListener("click",e=>{
 const c=e.target.closest(".chip");
 if(c){const t=c.dataset.t,s=c.dataset.s;st[t]===s?delete st[t]:st[t]=s;save();
  const a=A.find(x=>x[0]===t);if(cur===t&&!$("card").classList.contains("roll"))renderCard(a);renderList();return}
 const tb=e.target.closest(".tab");if(tb){tab=tb.dataset.tab;renderList()}
});
const LINK="https://claude.ai/artifact/T8SEHAfQijQ7QB3DCdrmb9",ST="BR1-";
const enc=()=>{let s="";for(const a of A)s+=S.indexOf(st[a[0]])+1;return ST+s.replace(/0+$/,"")};
const dec=t=>{const m=/BR1-[0-4]*/.exec(t||"");if(!m)return null;const o={};[...m[0].slice(4)].forEach((c,i)=>{if(c!=="0"&&A[i])o[A[i][0]]=S[+c-1]});return o};
let db=null,uid=null,uname="",sync=true,tm;
try{sync=localStorage.getItem("binge-sync")!=="off"}catch(e){}
function push(){if(!db||!uid||!sync)return;clearTimeout(tm);tm=setTimeout(async()=>{try{await db.doc("data/users/"+uid+"/library").set({code:enc(),updated:Date.now()})}catch(e){}},600)}
function refresh(){renderList();if(cur&&!$("card").classList.contains("roll"))renderCard(A.find(x=>x[0]===cur))}
function apply(o,replace){if(replace)st={};for(const t in o){if(replace||!st[t])st[t]=o[t]}save();refresh()}
async function pull(){if(!db||!uid||!sync)return;try{const s=await db.doc("data/users/"+uid+"/library").get();if(s.exists){const o=dec(s.data().code);if(o){const loc=st;st={...o};for(const t in loc)if(!st[t])st[t]=loc[t];save();refresh()}}else push()}catch(e){}}
function acct(){const e=$("acct");
 if(!db||!uid){e.innerHTML=`<span>Saving on this device only.</span><a href="https://claude.ai/login" target="_blank" rel="noopener">Sign in to sync</a>`;return}
 e.innerHTML=sync?`<span>Signed in as ${esc(uname||"you")} · library synced</span><button id="so">Sign out</button>`:`<span>Signed out · saving on this device only</span><button id="si">Sign in</button>`}
$("acct").onclick=e=>{const b=e.target.closest("button");if(!b)return;sync=b.id==="si";try{localStorage.setItem("binge-sync",sync?"on":"off")}catch(x){}acct();if(sync)pull()};
acct();
(async()=>{try{if(window.claude){const u=await claude.use("user");if(u){const me=await u.me();uid=me.id;uname=me.name||""}db=await claude.use("db")}}catch(e){db=null}acct();pull()})();
const P=$("panel");
const copy=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{$("ta").select();return document.execCommand("copy")}catch(x){return false}}};
$("shareBtn").onclick=()=>{const n=Object.keys(st).length,msg=`My Binge Roulette library (${n} titles). Open ${LINK}, tap My library > Import a library, and paste this code:\n${enc()}`;
 P.hidden=false;
 P.innerHTML=`<p class="m">${n} titles tracked. Send this to a friend:</p><textarea id="ta" readonly rows="4"></textarea><div><button class="pbt" id="cp">Copy</button>${navigator.share?'<button class="pbt" id="sh">Share…</button>':""}</div><p class="m" id="pm"></p>`;
 $("ta").value=msg;
 $("cp").onclick=async()=>{$("pm").textContent=(await copy(msg))?"Copied.":"Select the text above and copy it."};
 if($("sh"))$("sh").onclick=()=>{navigator.share({text:msg}).catch(()=>{})}};
$("impBtn").onclick=()=>{P.hidden=false;
 P.innerHTML=`<p class="m">Paste a library code, or the whole message a friend sent.</p><textarea id="ta" rows="3" placeholder="BR1-..."></textarea><div><button class="pbt" id="mg">Merge with mine</button><button class="pbt" id="rp">Replace mine</button></div><p class="m" id="pm"></p>`;
 let armed=false;
 const go=r=>{const o=dec($("ta").value);if(!o){$("pm").textContent="No library code found. A code starts with BR1-.";return}apply(o,r);$("pm").textContent=`Imported ${Object.keys(o).length} titles.`};
 $("mg").onclick=()=>go(false);
 $("rp").onclick=()=>{if(!armed){armed=true;$("rp").textContent="Tap again to replace";return}go(true)}};
$("libbtn").onclick=()=>{const s=$("lib"),o=s.hidden;s.hidden=!o;$("libbtn").setAttribute("aria-expanded",o);$("libbtn").textContent=o?"Hide my library":"Open my library";if(o)s.scrollIntoView({behavior:"smooth"})};
$("go").onclick=pick;$("q").oninput=renderList;renderList();
</script>
<footer>★ Ayush Sensei <small>先生</small> ★</footer>
